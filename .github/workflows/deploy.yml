# Mirrors main -> the Hugging Face Space git repo on every push. HF rebuilds
# the Space from the pushed content (README front-matter selects the Gradio
# SDK + app.py). Force-push because the Space repo is a one-way mirror of main.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the force-push to the Space is a normal git push,
          # not a shallow-clone rejection.
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}.git" \
            HEAD:main
