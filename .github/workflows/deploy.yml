# Publishes the repo to the Hugging Face Space on every push to main, via
# huggingface_hub (CLAUDE.md §8 Phase 11.3). Only HF_TOKEN is a secret; the
# Space id is public (it's in the URL), so it is hardcoded — this removes the
# empty-secret failure mode entirely. HF rebuilds the Space from the upload
# (README front-matter selects the Gradio SDK + app.py).
name: Deploy to Hugging Face Space

# If the org/Space ever changes, edit this one line.
env:
  HF_SPACE_ID: CG-Sphere/llm-application

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "huggingface_hub==0.27.0"

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is empty. Add it as a repository Actions "\
                 "secret (Settings -> Secrets and variables -> Actions), "\
                 "write scope, with access to the $HF_SPACE_ID org Space."
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              folder_path=".",
              commit_message="Deploy from GitHub Actions",
              # Never ship local-only / regenerable / junk into the Space.
              ignore_patterns=[
                  ".git/*",
                  ".github/*",
                  ".venv/*",
                  "data/chroma_db/*",
                  "data/raw/*",
                  "**/__pycache__/*",
                  ".pytest_cache/*",
                  ".ruff_cache/*",
              ],
          )
          print(f"Uploaded to https://huggingface.co/spaces/{os.environ['HF_SPACE_ID']}")
          PY
